<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tournament - Hypersomnia</title>
<!--
	A tournament's live page, served by the tournament's server itself (run_tournament.cpp) - the bracket from
	/tournament.json, read again every second. The look of hypersomnia.io/tournament (the site's main.css, "Tournament"),
	with the live score of a match being played in the middle.
-->
<style>
	:root {
		--bg: #030303;
		--line: rgb(60, 60, 60);
		--line-dim: rgb(35, 35, 35);
		--bright: rgb(220, 220, 220);
		--white: #fff;
		--dim: rgb(127, 127, 127);
		--faint: rgb(90, 90, 90);
		--accent: rgb(255, 176, 64);
		--number: rgb(205, 230, 235);
		--online: rgb(34, 197, 76);
		--red: rgb(244, 71, 71);
		--gold: rgb(255, 215, 0);
		--live: rgb(255, 80, 80);
		--font: Verdana, "DejaVu Sans", "Bitstream Vera Sans", sans-serif;
	}

	* {
		box-sizing: border-box;
	}

	body {
		margin: 0;
		background: var(--bg);
		color: var(--bright);
		font-family: var(--font);
	}

	.tournament-page {
		font-size: 18px;
		max-width: 1400px;
		margin: 0 auto;
		padding: 3em 1.5em 4em;
	}

	.tournament-empty {
		text-align: center;
		margin: 4em 0;
		font-size: 1.4em;
		color: var(--dim);
	}

	.tournament-winner {
		display: flex;
		flex-direction: column;
		align-items: center;
		margin: 1em 0 2em;
		gap: 1em;
	}

	.tournament-winner-label {
		font-size: clamp(1.5em, 5vw, 3em);
		margin: 0;
		color: var(--gold);
		animation: blink 1s steps(1, end) infinite;
	}

	@keyframes blink {
		0%, 100% { opacity: 1; }
		50% { opacity: 0.55; }
	}

	@keyframes blink-show {
		0%, 100% { opacity: 0; }
		50% { opacity: 1; }
	}

	.tournament-winner .team-card.won {
		min-width: 260px;
		font-size: 1.6em;
		padding: 0.8em 1.6em;
		color: var(--gold);
		border-color: var(--gold);
		box-shadow: 0 0 0 1px var(--gold), 0 0 24px rgba(255, 215, 0, 0.35);
	}

	.tournament-winner .team-card::after {
		content: '';
		position: absolute;
		inset: -4px;
		border: 1px dotted var(--gold);
		pointer-events: none;
		animation: blink-show 1s steps(1, end) infinite;
	}

	.tournament-separator {
		border: none;
		border-top: 1px dotted var(--line);
		margin: 2em 0 2.5em;
	}

	.bracket-stack {
		display: flex;
		flex-direction: column;
		align-items: center;
		padding: 0.5em 0;
	}

	.stage-section {
		display: flex;
		flex-direction: column;
		align-items: center;
		gap: 10px;
		padding: 0.5em 0;
	}

	.stage-separator {
		margin: 1.2em 0;
		width: min(80%, 480px);
	}

	.stage-label {
		position: relative;
		align-self: center;
		font-size: 0.6em;
		text-transform: uppercase;
		color: var(--accent);
		padding: 0.6em 1em;
		border: 1px solid var(--accent);
		margin-bottom: 0.4em;
	}

	.stage-label::before {
		content: "[ ";
		color: var(--dim);
	}

	.stage-label::after {
		content: " ]";
		color: var(--dim);
	}

	.stage-arena {
		margin: -0.6em 0 0.4em;
		color: var(--faint);
		font-size: 0.6em;
	}

	.match-pair {
		display: flex;
		align-items: center;
		justify-content: center;
		position: relative;
		gap: 8px;
	}

	.match-connector {
		flex: 0 0 auto;
		display: flex;
		flex-direction: column;
		align-items: stretch;
		justify-content: center;
		gap: 10px;
		width: 110px;
	}

	.match-score {
		font-size: 1.8em;
		color: var(--number);
		background: var(--bg);
		border: 1px solid var(--line);
		line-height: 1.2;
		white-space: pre;
		width: 100%;
		text-align: center;
	}

	/* a match being played: its score as it is */
	.match-score.live {
		color: var(--live);
		border-color: var(--live);
	}

	.match-line {
		display: block;
		width: 100%;
		height: 0;
		border-top: 2px dotted var(--line);
	}

	.team-card {
		position: relative;
		display: flex;
		align-items: center;
		justify-content: center;
		padding: 0.5em 1em;
		min-width: 200px;
		text-align: center;
		font-size: 1.3em;
		word-break: break-word;
		color: var(--bright);
		background: var(--bg);
		border: 1px solid var(--line);
	}

	.team-card:hover {
		border-color: var(--white);
	}

	.team-card.won {
		color: var(--online);
		border-color: var(--online);
		box-shadow: 0 0 10px rgba(34, 197, 76, 0.25);
	}

	.team-card.lost {
		color: var(--red);
		border-color: rgba(244, 71, 71, 0.5);
		text-decoration: line-through;
		text-decoration-thickness: 2px;
		opacity: 0.8;
	}

	/* nobody there yet: an open match of round 1 waiting for its pair */
	.team-card.empty {
		color: var(--faint);
		border-style: dotted;
	}

	.team-card.bye {
		color: var(--faint);
		border-color: var(--line-dim);
		border-style: dotted;
	}

	.team-card.pulse::after,
	.stage-label.pulse::after {
		content: '';
		position: absolute;
		inset: -4px;
		border: 1px dotted var(--white);
		pointer-events: none;
		animation: blink-show 1s steps(1, end) infinite;
	}

	.stage-label.pulse::after {
		color: transparent;
	}

	.team-card .bye-tag {
		display: inline-block;
		margin-left: 0.5em;
		font-size: 0.75em;
		text-transform: uppercase;
		text-decoration: none;
		color: var(--faint);
	}

	.team-card .bye-tag::before {
		content: "[";
	}

	.team-card .bye-tag::after {
		content: "]";
	}

	@media (max-width: 700px) {
		.tournament-page {
			padding: 1.5em 0.75em 2em;
		}

		.stage-section {
			gap: 8px;
		}

		.match-pair {
			gap: 4px;
		}

		.match-connector {
			width: 80px;
			gap: 7px;
		}

		.match-score {
			font-size: 1.3em;
		}

		.team-card {
			min-width: 120px;
			padding: 0.4em 0.6em;
			font-size: 1em;
		}

		.tournament-winner .team-card {
			min-width: 200px;
			font-size: 1.3em;
		}
	}
</style>
</head>
<body>
<main class="tournament-page">
	<div id="tournament-root"><p class="tournament-empty">Loading the tournament...</p></div>
</main>
<script>
(() => {
	const root = document.getElementById('tournament-root');

	const el = (tag, cls, text) => {
		const e = document.createElement(tag);

		if (cls) {
			e.className = cls;
		}

		if (text !== undefined) {
			e.textContent = text;
		}

		return e;
	};

	const label = names => names && names.length ? names.join(', ') : '?';
	const pad2 = n => String(n).padStart(2, ' ');

	function teamCard(names, cls, placeholder) {
		const empty = !names || !names.length;
		return el('div', 'team-card' + (cls ? ' ' + cls : '') + (empty ? ' empty' : ''), empty ? placeholder : label(names));
	}

	function connector(m) {
		const box = el('div', 'match-connector');

		if (m.status === 'done' && m.score_a >= 0) {
			box.appendChild(el('span', 'match-score', `${pad2(m.score_a)} ${pad2(m.score_b)}`));
		}
		else if (m.status === 'live' && m.score_a >= 0) {
			box.appendChild(el('span', 'match-score live', `${pad2(m.score_a)} ${pad2(m.score_b)}`));
		}
		else {
			box.appendChild(el('span', 'match-line'));
		}

		return box;
	}

	/*
		As on hypersomnia.io/tournament: a decided match with its winner on the left, the loser struck through
		on the right, the score between them - a match being played with its live score there.
	*/

	function matchPair(m, current) {
		if (m.status === 'empty' || m.status === 'coming') {
			return null;
		}

		if (m.status === 'walkover') {
			const card = el('div', 'team-card bye', label(m.team_a));
			card.appendChild(el('span', 'bye-tag', 'walkover'));
			return card;
		}

		const pair = el('div', 'match-pair');
		const decided = m.status === 'done';
		const winnerIsB = decided && m.winner === 'b';

		const left = winnerIsB ? m.team_b : m.team_a;
		const right = winnerIsB ? m.team_a : m.team_b;
		const leftScore = winnerIsB ? m.score_b : m.score_a;
		const rightScore = winnerIsB ? m.score_a : m.score_b;

		const pending = current && !decided ? 'pulse' : '';
		const waiting = m.status === 'waiting' ? (m.server_name || 'waiting...') : '?';

		pair.appendChild(teamCard(left, decided ? 'won' : pending, waiting));
		pair.appendChild(connector(Object.assign({}, m, { score_a: leftScore, score_b: rightScore })));
		pair.appendChild(teamCard(right, decided ? 'lost' : pending, waiting));

		return pair;
	}

	function render(t) {
		root.innerHTML = '';
		document.title = `Hypersomnia ${t.title}`;

		if (t.finished && t.winner && t.winner.length) {
			const winner = el('div', 'tournament-winner');
			winner.appendChild(el('h2', 'tournament-winner-label', 'WINNER'));
			winner.appendChild(el('div', 'team-card won', label(t.winner)));
			root.appendChild(winner);
			root.appendChild(el('hr', 'tournament-separator'));
		}

		// the rounds played and the one being played - the newest first
		const played = t.rounds.filter((r, i) => i <= t.current_round);

		if (!played.length) {
			root.appendChild(el('p', 'tournament-empty', 'No matches found.'));
			return;
		}

		const stack = el('div', 'bracket-stack');

		played.slice().reverse().forEach((r, idx) => {
			const i = played.length - 1 - idx;
			const current = !t.finished && i === t.current_round;

			if (idx > 0) {
				stack.appendChild(el('hr', 'tournament-separator stage-separator'));
			}

			const section = el('div', 'stage-section');
			section.appendChild(el('div', 'stage-label' + (current ? ' pulse' : ''), r.name));

			if (r.arena) {
				section.appendChild(el('div', 'stage-arena', r.arena));
			}

			r.matches.forEach(m => {
				const pair = matchPair(m, current);

				if (pair) {
					section.appendChild(pair);
				}
			});

			(r.byes || []).forEach(b => {
				const card = el('div', 'team-card bye', label(b));
				card.appendChild(el('span', 'bye-tag', 'bye'));
				section.appendChild(card);
			});

			stack.appendChild(section);
		});

		root.appendChild(stack);
	}

	async function refresh() {
		try {
			const res = await fetch('tournament.json', { cache: 'no-store' });
			render(await res.json());
		}
		catch (e) {}

		setTimeout(refresh, 1000);
	}

	refresh();
})();
</script>
</body>
</html>
