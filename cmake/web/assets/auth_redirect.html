<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hypersomnia - signed in</title>
  <style>
    body, html {
      background-color: #111; /* Dark gray background */
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden; /* Prevent scrollbars */
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .close-text {
      color: white; /* White text color */
      font-size: 48px; /* Increased font size */
    }
    .close-text2 {
      color: white; /* White text color */
      font-size: 30px; /* Increased font size */
    }
    .center-container {
      position: absolute;
      text-align: center;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }
  </style>
<script>
/*
  "Sign in with Steam" from the web build: hypersomnia.io sends the one-time link code here with the game's state.
  Handed only to the game in this browser (same origin) - the game checks the state and links.
*/
window.onload = function() {
    const params = new URLSearchParams(window.location.hash.substring(1));
    const code = params.get('code');
    const state = params.get('state');

    if (code && state && /^[A-Z0-9]{8}$/.test(code) && /^[0-9a-f]{32}$/.test(state)) {
        const message = { type: 'steam_link', code: code, state: state };

        // The game in a top-level tab of this origin: the popup lost its opener on the way through Steam (COOP)
        try {
            const channel = new BroadcastChannel('auth_bridge');
            channel.postMessage(message);
            channel.close();
        } catch (e) {
            console.warn("auth_redirect: BroadcastChannel failed:", e);
        }

        // The game in an iframe: its opener survives, this page has no COOP
        if (window.opener) {
            try {
                window.opener.postMessage(message, window.location.origin);
            } catch (e) {
                console.warn("auth_redirect: window.opener.postMessage failed:", e);
            }
        }

        // Nothing stays in the address bar or the history
        history.replaceState(null, '', window.location.pathname);

        // Back to the game - browsers allow it for a tab the game opened, otherwise the text below says it
        setTimeout(function() { window.close(); }, 500);
    }
};
</script>
</head>
<body>

  <div class="center-container">
<span class="close-text">Signed in.</span><br>
<br>
<span class="close-text2">Go back to the game.</span>
  </div>
</body>
</html>
